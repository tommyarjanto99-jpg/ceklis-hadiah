<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ceklis Pembagian Hadiah Masal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

  <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-md p-6">
    <!-- Header Aplikasi -->
    <div class="flex flex-col md:flex-row justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-gray-800 text-center md:text-left mb-4 md:mb-0">🎁 Monitoring Pembagian Hadiah</h1>
      <button onclick="toggleForm()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg shadow transition">
        ➕ Tambah Penerima Masal
      </button>
    </div>

    <!-- Form Tambah Penerima Masal -->
    <div id="formTambah" class="hidden bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6">
      <h2 class="text-lg font-bold text-blue-800 mb-3">Form Input Penerima Masal</h2>
      <form onsubmit="tambahPenerimaMasal(event)" class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Nama Desa</label>
          <input type="text" id="inputDesa" required placeholder="Contoh: Sukamaju" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">RT / RW</label>
          <input type="text" id="inputRT" required placeholder="Contoh: RT 01" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Pilihan Hadiah / Konsumsi</label>
          <select id="inputJenis" required class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none bg-white">
            <option value="Nasi">🍚 Nasi</option>
            <option value="Roti">🍞 Roti</option>
          </select>
        </div>
        <div class="md:col-span-3">
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Daftar Nama Penerima (Satu nama per baris)</label>
          <textarea id="inputNamaMasal" rows="4" required placeholder="Budi Santoso&#10;Siti Rahma&#10;Ahmad Supardi" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
          <span class="text-xs text-gray-500">*Tekan Enter untuk memisahkan antar nama penerima.</span>
        </div>
        <div class="md:col-span-3 flex justify-end gap-2 mt-2">
          <button type="button" onclick="toggleForm()" class="bg-gray-400 hover:bg-gray-500 text-white px-4 py-2 rounded-md font-semibold text-sm">Batal</button>
          <button type="submit" id="btnSimpan" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md font-semibold text-sm">Simpan Semua Data</button>
        </div>
      </form>
    </div>

    <!-- Filter Desa, RT, dan Jenis -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <div>
        <label class="block text-sm font-medium text-gray-700">Pilih Desa</label>
        <select id="selectDesa" onchange="filterData()" class="mt-1 block w-full p-2 border border-gray-300 rounded-md">
          <option value="">-- Semua Desa --</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Pilih RT</label>
        <select id="selectRT" onchange="filterData()" class="mt-1 block w-full p-2 border border-gray-300 rounded-md">
          <option value="">-- Semua RT --</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Pilih Jenis Hadiah</label>
        <select id="selectJenis" onchange="filterData()" class="mt-1 block w-full p-2 border border-gray-300 rounded-md">
          <option value="">-- Semua Jenis (Nasi & Roti) --</option>
          <option value="Nasi">🍚 Nasi</option>
          <option value="Roti">🍞 Roti</option>
        </select>
      </div>
    </div>

    <!-- Status Loading -->
    <div id="loading" class="text-center py-4 text-gray-500 font-semibold">Memuat Data Database...</div>

    <!-- Tabel Daftar Penerima -->
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-gray-200">
            <th class="p-3">Nama Penerima</th>
            <th class="p-3">Desa</th>
            <th class="p-3">RT</th>
            <th class="p-3">Jenis</th>
            <th class="p-3 text-center">Status Aksi</th>
            <th class="p-3 text-center">Kelola</th>
          </tr>
        </thead>
        <tbody id="penerimaTableBody">
          <!-- Data dari Spreadsheet akan masuk ke sini -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal Edit Data -->
  <div id="modalEdit" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-lg p-6 max-w-md w-full">
      <h2 class="text-lg font-bold text-gray-800 mb-4">Edit Data Penerima</h2>
      <input type="hidden" id="editId">
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Nama Penerima</label>
          <input type="text" id="editNama" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Nama Desa</label>
          <input type="text" id="editDesa" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">RT / RW</label>
          <input type="text" id="editRT" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Jenis Hadiah</label>
          <select id="editJenis" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none bg-white">
            <option value="Nasi">🍚 Nasi</option>
            <option value="Roti">🍞 Roti</option>
          </select>
        </div>
      </div>
      <div class="flex justify-end gap-2 mt-5">
        <button onclick="closeModalEdit()" class="bg-gray-400 hover:bg-gray-500 text-white px-4 py-2 rounded-md font-semibold text-sm">Batal</button>
        <button onclick="simpanEdit()" id="btnSimpanEdit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md font-semibold text-sm">Simpan Perubahan</button>
      </div>
    </div>
  </div>

  <script>
    // URL Web App Google Apps Script milik Anda
    const API_URL = "https://script.google.com/macros/s/AKfycbyVquBMWxrAEFN_tiDjFr1_Jhd8yvloAe7RrdtyCqX-gvTf5OXyUMnN0UgxI0FnvBMJ/exec"; 
    
    let dbData = [];

    async function loadData() {
      document.getElementById('loading').classList.remove('hidden');
      try {
        const response = await fetch(API_URL);
        dbData = await response.json();
        
        populateDropdowns();
        filterData();
      } catch (err) {
        alert("Gagal memuat data dari Spreadsheet. Pastikan Spreadsheet terhubung dengan benar.");
      } finally {
        document.getElementById('loading').classList.add('hidden');
      }
    }

    function toggleForm() {
      const form = document.getElementById('formTambah');
      form.classList.toggle('hidden');
    }

    function populateDropdowns() {
      const desaSelect = document.getElementById('selectDesa');
      const rtSelect = document.getElementById('selectRT');

      const currentDesa = desaSelect.value;
      const currentRT = rtSelect.value;

      const desaList = [...new Set(dbData.map(item => item.desa))].filter(Boolean);
      const rtList = [...new Set(dbData.map(item => item.rt))].filter(Boolean);

      desaSelect.innerHTML = '<option value="">-- Semua Desa --</option>';
      rtSelect.innerHTML = '<option value="">-- Semua RT --</option>';

      desaList.forEach(d => desaSelect.innerHTML += `<option value="${d}">${d}</option>`);
      rtList.forEach(r => rtSelect.innerHTML += `<option value="${r}">${r}</option>`);

      desaSelect.value = currentDesa;
      rtSelect.value = currentRT;
    }

    function filterData() {
      const selectedDesa = document.getElementById('selectDesa').value;
      const selectedRT = document.getElementById('selectRT').value;
      const selectedJenis = document.getElementById('selectJenis').value;

      const filtered = dbData.filter(item => {
        return (selectedDesa === "" || item.desa == selectedDesa) &&
               (selectedRT === "" || item.rt == selectedRT) &&
               (selectedJenis === "" || item.jenis == selectedJenis);
      });

      renderTable(filtered);
    }

    function renderTable(data) {
      const tbody = document.getElementById('penerimaTableBody');
      tbody.innerHTML = "";

      if(data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-500">Data tidak ditemukan.</td></tr>`;
        return;
      }

      data.forEach(item => {
        const isChecked = item.status === "Sudah";
        const badgeColor = item.jenis === "Roti" ? "bg-amber-100 text-amber-800" : "bg-blue-100 text-blue-800";
        
        tbody.innerHTML += `
          <tr class="border-b hover:bg-gray-50">
            <td class="p-3 font-semibold">${item.nama}</td>
            <td class="p-3">${item.desa}</td>
            <td class="p-3">${item.rt}</td>
            <td class="p-3">
              <span class="px-2 py-1 rounded-full text-xs font-semibold ${badgeColor}">
                ${item.jenis === "Roti" ? '🍞 Roti' : '🍚 Nasi'}
              </span>
            </td>
            <td class="p-3 text-center">
              <label class="inline-flex items-center cursor-pointer">
                <input type="checkbox" ${isChecked ? "checked" : ""} 
                       onchange="updateStatus(${item.id}, this.checked)"
                       class="w-5 h-5 text-green-600 rounded focus:ring-green-500">
                <span class="ml-2 text-sm ${isChecked ? 'text-green-600 font-bold' : 'text-gray-500'}">
                  ${isChecked ? 'Sudah Diserahkan' : 'Belum'}
                </span>
              </label>
            </td>
            <td class="p-3 text-center">
              <div class="flex justify-center gap-2">
                <button onclick="openModalEdit(${item.id})" class="bg-yellow-500 hover:bg-yellow-600 text-white text-xs px-2.5 py-1.5 rounded transition">✏️ Edit</button>
                <button onclick="hapusPenerima(${item.id}, '${item.nama}')" class="bg-red-600 hover:bg-red-700 text-white text-xs px-2.5 py-1.5 rounded transition">🗑️ Hapus</button>
              </div>
            </td>
          </tr>
        `;
      });
    }

    async function updateStatus(id, checked) {
      const newStatus = checked ? "Sudah" : "Belum";
      const index = dbData.findIndex(item => item.id == id);
      if(index !== -1) dbData[index].status = newStatus;
      filterData();

      try {
        await fetch(API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "update", id: id, status: newStatus })
        });
      } catch (err) {
        alert("Gagal memperbarui status ke database!");
      }
    }

    async function tambahPenerimaMasal(event) {
      event.preventDefault();
      
      const btnSimpan = document.getElementById('btnSimpan');
      btnSimpan.innerText = "Menyimpan Data Masal...";
      btnSimpan.disabled = true;

      const desa = document.getElementById('inputDesa').value.trim();
      const rt = document.getElementById('inputRT').value.trim();
      const jenis = document.getElementById('inputJenis').value;
      const namaMasalText = document.getElementById('inputNamaMasal').value;

      const daftarNama = namaMasalText.split('\n').map(n => n.trim()).filter(n => n.length > 0);

      if (daftarNama.length === 0) {
        alert("Masukkan minimal satu nama penerima!");
        btnSimpan.innerText = "Simpan Semua Data";
        btnSimpan.disabled = false;
        return;
      }

      for (let i = 0; i < daftarNama.length; i++) {
        const nama = daftarNama[i];
        const id = new Date().getTime() + i;
        const newItem = { id: id, desa: desa, rt: rt, nama: nama, jenis: jenis, status: "Belum" };

        try {
          await fetch(API_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "add", ...newItem })
          });
          dbData.push(newItem);
        } catch (err) {
          console.error("Gagal menyimpan:", nama);
        }
      }

      populateDropdowns();
      filterData();

      document.getElementById('inputNamaMasal').value = "";
      document.getElementById('inputDesa').value = "";
      document.getElementById('inputRT').value = "";
      toggleForm();
      
      alert(`Berhasil menambahkan ${daftarNama.length} penerima (${jenis})!`);
      btnSimpan.innerText = "Simpan Semua Data";
      btnSimpan.disabled = false;
    }

    function openModalEdit(id) {
      const item = dbData.find(d => d.id == id);
      if(!item) return;

      document.getElementById('editId').value = item.id;
      document.getElementById('editNama').value = item.nama;
      document.getElementById('editDesa').value = item.desa;
      document.getElementById('editRT').value = item.rt;
      document.getElementById('editJenis').value = item.jenis || "Nasi";

      document.getElementById('modalEdit').classList.remove('hidden');
    }

    function closeModalEdit() {
      document.getElementById('modalEdit').classList.add('hidden');
    }

    async function simpanEdit() {
      const id = document.getElementById('editId').value;
      const nama = document.getElementById('editNama').value.trim();
      const desa = document.getElementById('editDesa').value.trim();
      const rt = document.getElementById('editRT').value.trim();
      const jenis = document.getElementById('editJenis').value;

      if(!nama || !desa || !rt) {
        alert("Semua field harus diisi!");
        return;
      }

      const btnSimpan = document.getElementById('btnSimpanEdit');
      btnSimpan.innerText = "Menyimpan...";
      btnSimpan.disabled = true;

      const index = dbData.findIndex(item => item.id == id);
      if(index !== -1) {
        dbData[index].nama = nama;
        dbData[index].desa = desa;
        dbData[index].rt = rt;
        dbData[index].jenis = jenis;
      }

      populateDropdowns();
      filterData();
      closeModalEdit();

      try {
        await fetch(API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "edit", id: id, nama: nama, desa: desa, rt: rt, jenis: jenis })
        });
      } catch (err) {
        alert("Gagal memperbarui data ke server!");
      } finally {
        btnSimpan.innerText = "Simpan Perubahan";
        btnSimpan.disabled = false;
      }
    }

    async function hapusPenerima(id, nama) {
      if(!confirm(`Apakah Anda yakin ingin menghapus "${nama}" dari daftar?`)) return;

      dbData = dbData.filter(item => item.id != id);
      populateDropdowns();
      filterData();

      try {
        await fetch(API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "delete", id: id })
        });
      } catch (err) {
        alert("Gagal menghapus data dari server!");
      }
    }

    loadData();
  </script>
</body>
</html>
